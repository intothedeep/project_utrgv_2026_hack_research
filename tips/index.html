<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HACK · Tips</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Tokens from skills/html-theme/theme.css, light only. One shell, pages stay as they are. */
:root{--background:oklch(1 0 0);--foreground:oklch(.145 0 0);--primary:oklch(.205 0 0);--primary-foreground:oklch(.985 0 0);--muted-foreground:oklch(.556 0 0);--border:oklch(.55 0 0);--rule:oklch(.9 0 0);--signal-plan:#0432ff;--font:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font:14px/1.5 var(--font)}
header{padding:10px 16px;border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
h1{margin:0;font-size:15px;font-weight:700}
.lang{display:flex;margin-left:auto}
.lang button{padding:4px 10px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:inherit;font-weight:500;cursor:pointer}
.lang button+button{border-left:0}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{padding:5px 10px;border:1px solid var(--rule);color:var(--signal-plan);text-decoration:none;font-weight:500}
nav a:hover{border-color:var(--border)}
nav a[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
#note{margin:8px 0 0;color:var(--muted-foreground);font-size:13px}
#note a{color:var(--signal-plan)}
iframe{flex:1;width:100%;border:0;display:block}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title"></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
  <nav id="tabs" aria-label="Tips pages"></nav>
  <p id="note"></p>
</header>
<iframe id="page" title="Selected tips page"></iframe>
<script>
// Each project has a Korean file and an English file. The language button picks one.
var PAGES = [
  {id: "circle", fileKo: "Wylie_SmallestCircle/study_tips.html", fileEn: "Wylie_SmallestCircle/study_tips_en.html", ko: "세 직선 최소 원", en: "Smallest circle", noteKo: "3차원 세 직선과 만나는 가장 작은 원", noteEn: "The smallest circle that meets three lines in 3D"},
  {id: "tileset", fileKo: "Dr_Schwaller_MinTileset/study_tips.html", fileEn: "Dr_Schwaller_MinTileset/study_tips_en.html", ko: "2×n 최소 타일 집합", en: "2×n minimum tileset", noteKo: "2×n 직사각형의 최소 타일 집합", noteEn: "Minimum tileset for a 2×n rectangle"},
  {id: "circle-paper", file: "../papers/Wylie_SmallestCircle/main.pdf", ko: "최소 원 논문 PDF", en: "Smallest circle paper PDF", external: true},
  {id: "tileset-paper", file: "../papers/Dr_Schwaller_MinTileset/main.pdf", ko: "타일 집합 논문 PDF", en: "Tileset paper PDF", external: true}
];
var TEXT = {ko: {title: "UTRGV 연구 해커톤 2026 tips", open: "새 탭에서 열기"}, en: {title: "UTRGV Research Hackathon 2026 tips", open: "Open in a new tab"}};
var tabs = document.getElementById("tabs"), frame = document.getElementById("page"), note = document.getElementById("note");
var buttons = document.querySelectorAll(".lang button");
var lang = "ko";
try { if (localStorage.getItem("hack-lang") === "en") { lang = "en"; } } catch (e) {}

function fileOf(p) { return p.file || (lang === "en" ? p.fileEn : p.fileKo); }

function drawTabs(current) {
  tabs.textContent = "";
  PAGES.forEach(function (p) {
    var a = document.createElement("a");
    a.textContent = p[lang] + (p.external ? " ↗" : "");
    if (p.external) { a.href = p.file; a.target = "_blank"; a.rel = "noopener"; }
    else { a.href = "#" + p.id; }
    if (p === current) { a.setAttribute("aria-current", "page"); }
    tabs.appendChild(a);
  });
}

function show() {
  var id = location.hash.slice(1);
  var p = PAGES.filter(function (x) { return x.id === id && !x.external; })[0] || PAGES[0];
  var src = fileOf(p);
  if (frame.getAttribute("src") !== src) { frame.setAttribute("src", src); }
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = TEXT[lang].title;
  drawTabs(p);
  note.textContent = (lang === "en" ? p.noteEn : p.noteKo) + " · ";
  var open = document.createElement("a");
  open.href = src; open.target = "_blank"; open.rel = "noopener"; open.textContent = TEXT[lang].open;
  note.appendChild(open);
  buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
  document.title = "HACK · " + p[lang] + " · Tips";
}

buttons.forEach(function (b) {
  b.addEventListener("click", function () {
    lang = b.dataset.lang;
    try { localStorage.setItem("hack-lang", lang); } catch (e) {}
    show();
  });
});
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
